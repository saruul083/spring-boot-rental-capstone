<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rental Capstone - Home</title>
    <link rel="stylesheet" th:href="@{css/style.css}" />
</head>
<body>
    <div class="navbar">
        <h1>Rental Capstone</h1>
    </div>

    <div class="container">
        <h2>Welcome to the Rental Application</h2>
        <p>Manage items, customers, and bookings for your rental business.</p>
        
        <div style="margin: 2rem 0;">
            <a href="/items" class="btn">Manage Items</a>
            <a href="/customers" class="btn btn-secondary">Manage Customers</a>
            <a href="/bookings/new" class="btn btn-primary">Make a Booking</a>
        </div>
        
        <p>Total Items: <span th:text="#{items.size}">0</span></p>
        <p>Total Bookings: <span th:text="#{bookings.size}">0</span></p>
    </div>
</body>
</html>
