<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Item Form</title>
    <link rel="stylesheet" th:href="@{css/style.css}" />
</head>
<body>
    <div class="navbar">
        <h1>Item Form</h1>
    </div>

    <div class="container">
        <h2 th:if="${item.id}">Edit Item</h2>
        <h2 th:unless="${item.id}">New Item</h2>
        
        <form action th:action="@{/items/save}" th:object="${item}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" th:field="*{name}" required/>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" th:field="*{category}">
                    <option value="" disabled th:if="${categories.isEmpty}">Select category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Electronics</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" th:field="*{description}" rows="3"></textarea>
            </div>
            
            <div class="form-group">
                <label for="dailyRate">Daily Rate</label>
                <input type="number" id="dailyRate" name="dailyRate" step="0.01" th:field="*{dailyRate}" required/>
            </div>
            
            <button type="submit" class="btn">${item.id ? 'Update' : 'Create'} Item</button>
            <a href="/items" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
