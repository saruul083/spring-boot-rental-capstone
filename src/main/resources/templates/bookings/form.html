<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Booking Form</title>
    <link rel="stylesheet" th:href="@{css/style.css}" />
</head>
<body>
    <div class="navbar">
        <h1>New Booking</h1>
    </div>

    <div class="container">
        <form action th:action="@{/bookings/save}" method="post">
            <div class="form-group">
                <label for="itemId">Item</label>
                <select id="itemId" name="itemId" th:required="true">
                    <option value="" disabled>Select an item</option>
                    <option th:each="item : ${items}" th:value="${item.id}" th:text="${item.name} + ' ($' + ${item.dailyRate} /day')">
                        Laptop - $25.00/day
                    </option>
                </select>
                <span th:if="${#fields.hasErrors('itemId')}" class="date-error" th:errors="*{itemId}">Invalid item</span>
            </div>
            
            <div class="form-group">
                <label for="customerId">Customer</label>
                <select id="customerId" name="customerId" th:required="true">
                    <option value="" disabled>Select a customer</option>
                    <option th:each="customer : ${customers}" th:value="${customer.id}" th:text="${customer.name}">
                        John Doe
                    </option>
                </select>
                <span th:if="#fields.hasErrors('customerId')" class="date-error" th:errors="*{customerId}">Invalid customer</span>
            </div>
            
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" name="startDate" th:required="true"/>
                <span class="date-error" id="dateError"></span>
            </div>
            
            <div class="form-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" name="endDate" th:required="true"/>
                <span class="date-error" id="dateError"></span>
            </div>
            
            <input type="hidden" name="durationDays" id="duration" />
            <input type="hidden" name="totalPrice" id="totalPrice" />
            
            <button type="submit" class="btn btn-primary">Create Booking</button>
            <a href="/bookings" class="btn btn-secondary">Cancel</a>
        </form>
        
        <script th:src="@{js/booking.js}"></script>
    </div>
</body>
</html>
